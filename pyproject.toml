[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brazilian_ids"
version = "0.4.0"
authors = [
    { name = "Alceu Rodrigues de Freitas Junior", email = "glasswalk3r@yahoo.com.br" },
]
license = { file = "LICENSE" }
description = "provides functions and classes to validate several Brazilian IDs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
]

keywords = [
    "brazil",
    "brasil",
    "cnpj",
    "cno",
    "cpf",
    "pis",
    "pasep",
    "cep",
    "municipio",
    "sql",
    "processo",
    "jurídico",
]

dependencies = []

[project.optional-dependencies]
extended-cep = ["httpx==0.28.1", "pydantic==2.13.4"]
dev = [
    "bump-my-version==0.25.4",
    "mypy==2.3.1",
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "Sphinx==8.0.2",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "ruff>=0.16.3",
    "tox>=4.60.0",
    "tox-uv-bare>=1.36.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brazilian_ids"]

[project.urls]
Homepage = "https://github.com/glasswalk3r/brazilian-ids"
Repository = "https://github.com/glasswalk3r/brazilian-ids.git"
Issues = "https://github.com/glasswalk3r/brazilian-ids/issues"

[tool.setuptools.package-data]
"brazilian_ids" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "6.0"

pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus:
# - RUF: ruff-specific rules (e.g. ClassVar for mutable class attributes)
# - UP: pyupgrade, modern Python idioms (e.g. zero-arg super())
select = ["E4", "E7", "E9", "F", "RUF", "UP"]

[tool.bumpversion]
# current_version is intentionally not set here: bump-my-version derives it from the latest
# matching git tag (see tag_name below) so [project].version stays the only version literal
# written in this file. Bootstrapped with `git tag 0.3.0` to match [project].version above.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
sign_tags = false
tag_name = "{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
